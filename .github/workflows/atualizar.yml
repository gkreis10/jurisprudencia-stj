name: Atualizar e publicar

# Duas etapas:
#  1. coletar: consulta o portal do STJ a partir do computador do escritório (o portal recusa os
#     servidores do GitHub). Roda às segundas e quintas, ao meio-dia, e quando acionada à mão.
#  2. publicar: remonta o site com os dados guardados e o publica na Cloudflare. Roda a cada
#     envio de arquivos e depois da coleta; não consulta o STJ.
on:
  schedule:
    # Segundas e quintas, 12h (horário de Brasília = UTC-3).
    - cron: "0 15 * * 1,4"
  workflow_dispatch:
    inputs:
      carga_inicial:
        description: "Coletar do zero, sem a cópia dos dados guardada (carga pesada; só se a cópia sumiu)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "fontes/**", "functions/**", ".github/workflows/**"]

permissions:
  contents: read
  actions: write

jobs:
  coletar:
    # Só na agenda ou à mão. Se o computador do escritório estiver desligado, a tarefa fica
    # esperando por ele e a publicação segue com os dados anteriores (ver o job "publicar").
    if: ${{ github.event_name != 'push' }}
    runs-on: self-hosted
    timeout-minutes: 240
    concurrency:
      group: coleta-stj
      cancel-in-progress: false
    outputs:
      coleta: ${{ steps.coleta.outcome }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      # Os dados ficam guardados entre as execuções; assim, a cada coleta só se baixa o que
      # for novo no Portal de Dados Abertos do STJ.
      - name: Restaurar dados anteriores
        id: restaura
        uses: actions/cache/restore@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-${{ github.run_id }}
          restore-keys: dados-stj-
          enableCrossOsArchive: true

      # Sem a cópia, a coleta recomeçaria do zero e faria centenas de acessos ao STJ de uma vez.
      # Isso só é permitido de propósito (opção "carga_inicial" da execução manual).
      - name: Conferir a cópia dos dados
        id: base
        if: ${{ steps.restaura.outputs.cache-matched-key == '' && inputs.carga_inicial != true }}
        shell: powershell
        run: |
          Write-Output "::error::A cópia dos dados guardada no GitHub não foi encontrada. A coleta foi interrompida para não recomeçar do zero no portal do STJ."
          exit 1

      - name: Instalar dependências
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --quiet pdfplumber

      # Se o portal do STJ recusar o acesso (erro 403), a coleta para no primeiro recuo e esta
      # etapa termina com erro; as fontes que já tinham sido atualizadas ficam gravadas e as
      # demais mantêm os dados anteriores. O site é publicado mesmo assim.
      - name: Atualizar dados
        id: coleta
        continue-on-error: true
        shell: powershell
        run: .\.venv\Scripts\python.exe scripts\atualizar.py --desde 2000-01 --dias-radar 15

      - name: Guardar dados
        if: ${{ always() && steps.base.outcome != 'failure' }}
        uses: actions/cache/save@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-${{ github.run_id }}
          enableCrossOsArchive: true

  publicar:
    needs: coletar
    # Roda mesmo se a coleta foi pulada (envio de arquivos), falhou ou nem chegou a começar.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurar dados
        uses: actions/cache/restore@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-${{ github.run_id }}
          restore-keys: dados-stj-
          enableCrossOsArchive: true

      - name: Instalar dependências
        run: pip install pdfplumber

      # STF: temas de repercussão geral, súmulas e composição (registro em fontes/stf, coletado à
      # parte). Se o portal do STF não responder, o site mantém os dados do registro.
      - name: Atualizar dados do STF
        run: python scripts/stf.py --minutos 50

      # Notícias do STJ para o carrossel: um único acesso ao feed oficial (RSS) de notícias do portal do
      # STJ, oferecido pelo Tribunal para leitura por programas. Se não responder, o site segue sem elas.
      - name: Notícias do STJ
        continue-on-error: true
        run: python scripts/noticias_stj.py

      # Cada coleta grava uma cópia nova dos dados (cerca de 500 MB). Sem limpeza, as cópias
      # antigas se acumulam e esgotam a cota de armazenamento do GitHub. Depois de a nova ter sido
      # gravada, apaga as anteriores; se não tiver sido gravada, as antigas são mantidas.
      - name: Apagar cópias antigas dos dados
        if: ${{ needs.coletar.result == 'success' || needs.coletar.result == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE_NOVA: dados-stj-${{ github.run_id }}
        run: |
          lista=$(gh cache list --repo "${{ github.repository }}" --key dados-stj- --limit 100 --json id,key)
          if echo "$lista" | jq -e --arg k "$CHAVE_NOVA" 'any(.[]; .key == $k)' > /dev/null; then
            echo "$lista" | jq -r --arg k "$CHAVE_NOVA" '.[] | select(.key != $k) | .id' | while read -r id; do
              gh cache delete "$id" --repo "${{ github.repository }}" && echo "Cópia antiga apagada: $id"
            done
          else
            echo "Nenhuma cópia nova foi gravada nesta execução; as antigas foram mantidas."
          fi

      # O GitHub desativa rotinas agendadas de repositórios sem atividade por
      # 60 dias. Reativar a rotina a cada execução reinicia essa contagem.
      - name: Manter a rotina agendada ativa
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable"

      # As miniaturas dos ministros não ficam no repositório: são geradas a partir da cópia
      # guardada em .cache/fotos. Sem esta etapa, o site seria publicado sem as fotos.
      - name: Recolocar as fotos dos ministros
        run: |
          mkdir -p site/img/ministros
          if ls .cache/fotos/*.jpg > /dev/null 2>&1; then
            cp -n .cache/fotos/*.jpg site/img/ministros/
          fi
          echo "Fotos no site: $(ls site/img/ministros | wc -l)"

      # Pasta publicada: acórdãos compactados, para o acervo longo caber no GitHub Pages.
      - name: Empacotar o site
        run: python scripts/empacotar.py

      # Conferência automática do site montado: dados, todas as seções, uma pesquisa, uma busca
      # por número e uma verificação de petição. Se falhar, esta execução não publica nada e o
      # site continua na versão anterior (o GitHub avisa por e-mail).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Conferir o site antes de publicar
        run: |
          npm install --no-save --no-audit --no-fund --silent playwright-core@1.55.0
          node scripts/teste-site.mjs _site

      # Publicação: o site fica só na Cloudflare, protegido por usuário e senha
      # (functions/_middleware.js). Se a publicação falhar, a execução fica marcada com erro
      # (o GitHub avisa por e-mail) e o site continua na versão anterior.
      - name: Publicar na Cloudflare
        if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=jurisprudencia-stj-gkreis10 --branch=main

      # Alerta de coleta do STF atrasada: depois de publicar, a execução agendada termina com erro
      # (e o GitHub avisa por e-mail) se o registro do STF, coletado à parte, tiver mais de 5 dias.
      - name: Conferir se a coleta do STF está em dia
        if: ${{ always() && github.event_name == 'schedule' }}
        run: python scripts/conferir_stf.py

      - name: Avisar se a coleta do STJ falhou
        if: ${{ always() && (needs.coletar.result == 'failure' || needs.coletar.outputs.coleta == 'failure') }}
        run: |
          echo "::error::A coleta do STJ falhou (portal indisponível ou acesso recusado, ou o computador do escritório estava desligado). O site foi publicado com os dados anteriores dessas fontes."
          exit 1
