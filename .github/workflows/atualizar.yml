name: Atualizar e publicar

on:
  schedule:
    # Todos os dias às 07h (horário de Brasília = UTC-3).
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "fontes/**", "functions/**", ".github/workflows/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Os dados ficam em cache entre as execuções; assim, a cada dia só se
      # baixa o que for novo no Portal de Dados Abertos do STJ.
      - name: Restaurar dados anteriores
        uses: actions/cache/restore@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-${{ github.run_id }}
          restore-keys: dados-stj-

      # Quando o envio muda só a aparência do site (pasta site/, proteção da Cloudflare ou
      # README), não é preciso consultar o STJ de novo: o site é remontado com os dados
      # guardados. A consulta completa continua na execução diária das 7h e sempre que
      # mudarem as rotinas (scripts/), as fontes (fontes/) ou este arquivo.
      - name: Verificar se é preciso consultar o STJ
        id: modo
        env:
          ANTES: ${{ github.event.before }}
        run: |
          so_site=false
          if [ "${{ github.event_name }}" = "push" ] && [ -f site/data/manifest.json ]; then
            if mudou=$(git diff --name-only "$ANTES" "$GITHUB_SHA" 2>/dev/null) && [ -n "$mudou" ]; then
              if ! printf '%s\n' "$mudou" | grep -qvE '^(site/|functions/|README\.md$)'; then
                so_site=true
              fi
            fi
          fi
          echo "so_site=$so_site" >> "$GITHUB_OUTPUT"
          if [ "$so_site" = true ]; then
            echo "Só o site mudou: usa os dados guardados, sem consultar o STJ." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Instalar dependências
        if: steps.modo.outputs.so_site != 'true'
        run: pip install pdfplumber

      # Se o portal do STJ recusar o acesso (erro 403), esta etapa termina com erro, mas as fontes
      # que funcionaram (publicações do DJEN, pautas etc.) foram atualizadas e as demais mantêm os
      # dados anteriores. O site é publicado mesmo assim, depois da conferência automática, e a
      # execução é marcada com erro no último passo, para o GitHub avisar por e-mail.
      - name: Atualizar dados
        id: coleta
        continue-on-error: true
        if: steps.modo.outputs.so_site != 'true'
        run: python scripts/atualizar.py --desde 2000-01 --dias-radar 15

      # STF: temas de repercussão geral, súmulas e composição (páginas oficiais do Supremo).
      # Se o portal do STF não responder, o site mantém os dados da execução anterior. Roda mesmo
      # quando o STJ falha: os dados ficam guardados para a próxima publicação.
      - name: Atualizar dados do STF
        if: always() && steps.modo.outputs.so_site != 'true'
        run: python scripts/stf.py --minutos 50

      - name: Guardar dados
        if: always() && steps.modo.outputs.so_site != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-${{ github.run_id }}

      # Cada execução completa grava uma cópia nova dos dados (cerca de 500 MB). Sem limpeza, as
      # cópias antigas se acumulam e esgotam a cota de armazenamento do GitHub. Depois de gravar
      # a nova, apaga as anteriores; se a nova não tiver sido gravada, as antigas são mantidas.
      - name: Apagar cópias antigas dos dados
        if: always() && steps.modo.outputs.so_site != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE_NOVA: dados-stj-${{ github.run_id }}
        run: |
          lista=$(gh cache list --repo "${{ github.repository }}" --key dados-stj- --limit 100 --json id,key)
          if echo "$lista" | jq -e --arg k "$CHAVE_NOVA" 'any(.[]; .key == $k)' > /dev/null; then
            echo "$lista" | jq -r --arg k "$CHAVE_NOVA" '.[] | select(.key != $k) | .id' | while read -r id; do
              gh cache delete "$id" --repo "${{ github.repository }}" && echo "Cópia antiga apagada: $id"
            done
          else
            echo "A cópia nova não foi gravada; as antigas foram mantidas."
          fi

      # O GitHub desativa rotinas agendadas de repositórios sem atividade por
      # 60 dias. Reativar a rotina a cada execução reinicia essa contagem.
      - name: Manter a rotina agendada ativa
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable"

      # As miniaturas dos ministros não ficam no repositório: são geradas a partir da cópia
      # guardada em .cache/fotos. Numa execução só do site (ou quando a coleta falha), elas
      # não são recriadas; sem esta etapa, o site seria publicado sem as fotos.
      - name: Recolocar as fotos dos ministros
        run: |
          mkdir -p site/img/ministros
          if ls .cache/fotos/*.jpg > /dev/null 2>&1; then
            cp -n .cache/fotos/*.jpg site/img/ministros/
          fi
          echo "Fotos no site: $(ls site/img/ministros | wc -l)"

      # Pasta publicada: acórdãos compactados, para o acervo longo caber no GitHub Pages.
      - name: Empacotar o site
        run: python scripts/empacotar.py

      # Conferência automática do site montado: dados, todas as seções, uma pesquisa, uma busca
      # por número e uma verificação de petição. Se falhar, esta execução não publica nada e o
      # site continua na versão anterior (o GitHub avisa por e-mail).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Conferir o site antes de publicar
        run: |
          npm install --no-save --no-audit --no-fund --silent playwright-core@1.55.0
          node scripts/teste-site.mjs _site

      # Publicação: o site fica só na Cloudflare, protegido por usuário e senha
      # (functions/_middleware.js). Se a publicação falhar, a execução fica marcada com erro
      # (o GitHub avisa por e-mail) e o site continua na versão anterior.
      - name: Publicar na Cloudflare
        if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=jurisprudencia-stj-gkreis10 --branch=main

      # Alerta de coleta do STF atrasada: depois de publicar, a execução diária termina com erro
      # (e o GitHub avisa por e-mail) se o registro do STF, coletado à parte, tiver mais de 5 dias.
      - name: Conferir se a coleta do STF está em dia
        if: ${{ always() && github.event_name == 'schedule' }}
        run: python scripts/conferir_stf.py

      - name: Avisar se a coleta do STJ falhou
        if: ${{ always() && steps.coleta.outcome == 'failure' }}
        run: |
          echo "::error::A coleta do STJ falhou (provavel bloqueio do portal). O site foi publicado com os dados anteriores dessas fontes."
          exit 1
