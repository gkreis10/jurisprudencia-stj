name: Diagnóstico do computador do escritório

# Teste manual, sem efeito sobre o site: confere as ferramentas instaladas no computador do
# escritório, faz um único acesso ao portal de dados abertos do STJ e verifica se a cópia
# dos dados guardada no GitHub pode ser reaproveitada por esse computador.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Ferramentas instaladas
        shell: powershell
        run: |
          foreach ($c in 'python --version', 'py --version', 'git --version', 'node --version', 'tar --version', 'zstd --version') {
            Write-Output "== $c"
            try { Invoke-Expression "$c 2>&1" | Select-Object -First 2 } catch { Write-Output "nao encontrado" }
          }
          Get-PSDrive C | ForEach-Object { "Livre em C: {0:N1} GB" -f ($_.Free / 1GB) }

      - name: Um único acesso ao portal do STJ
        shell: powershell
        run: |
          $py = @'
          import urllib.request, urllib.error
          req = urllib.request.Request("https://dadosabertos.web.stj.jus.br/api/3/action/package_show?id=pautas-futuras", headers={"User-Agent": "jurisprudencia-stj-site/1.0 (+atualizacao automatica de dados abertos)"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("HTTP", r.status, len(r.read()), "bytes")
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
          except Exception as e:
              print("erro", e)
          '@
          $py | Set-Content -Encoding utf8 teste_stj.py
          python teste_stj.py

      - name: A cópia dos dados do GitHub serve para este computador?
        id: copia
        uses: actions/cache/restore@v5
        with:
          path: |
            site/data
            .cache
          key: dados-stj-diagnostico
          restore-keys: dados-stj-
          enableCrossOsArchive: true
          lookup-only: true

      - name: Resultado do teste da cópia
        shell: powershell
        run: |
          "Cópia encontrada: '${{ steps.copia.outputs.cache-hit }}' ; chave: '${{ steps.copia.outputs.cache-matched-key }}'"
